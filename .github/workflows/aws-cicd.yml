name: AWS CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run application test
        working-directory: docker-app
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::120685574103:role/Adebayo-GitHub-Deploy-Role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login \
            --username AWS \
            --password-stdin 120685574103.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and push Docker image
        run: |
          IMAGE_URI="120685574103.dkr.ecr.us-east-1.amazonaws.com/adebayo-docker-app:${GITHUB_SHA}"

          docker build \
            -t "$IMAGE_URI" \
            docker-app

          docker push "$IMAGE_URI"

      - name: Create new launch template version
        run: |
          IMAGE_URI="120685574103.dkr.ecr.us-east-1.amazonaws.com/adebayo-docker-app:${GITHUB_SHA}"

          cat > user-data.sh <<SCRIPT
          #!/bin/bash
          dnf update -y
          dnf install -y docker awscli

          systemctl enable docker
          systemctl start docker

          aws ecr get-login-password --region us-east-1 | \
          docker login \
            --username AWS \
            --password-stdin 120685574103.dkr.ecr.us-east-1.amazonaws.com

          docker pull ${IMAGE_URI}

          docker run -d \
            --name adebayo-app \
            --restart unless-stopped \
            -p 80:3000 \
            ${IMAGE_URI}
          SCRIPT

          USER_DATA=$(base64 -w 0 user-data.sh)

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id lt-00abcccdd839c728a \
            --source-version '$Default' \
            --version-description "GitHub Actions ${GITHUB_SHA}" \
            --launch-template-data "{\"UserData\":\"${USER_DATA}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

          aws ec2 modify-launch-template \
            --launch-template-id lt-00abcccdd839c728a \
            --default-version "$NEW_VERSION"

      - name: Start Auto Scaling instance refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name Adebayo-ASG \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":300}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "REFRESH_ID=$REFRESH_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          for attempt in {1..40}; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name Adebayo-ASG \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Instance refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              exit 1
            fi

            sleep 30
          done

          echo "Deployment timed out."
          exit 1

      - name: Verify production application
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 15 \
            https://app.devops.taiwoadefowope.com
