name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run shell syntax check
        run: bash -n scripts/*.sh

      - name: Check scripts are executable
        run: |
          test -x scripts/deploy.sh
          test -x scripts/health-check.sh
          test -x scripts/system-info.sh

  test:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test health-check script
        run: ./scripts/health-check.sh

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployment package
        run: |
          tar -czf adebayo-devops-build.tar.gz \
            scripts/ \
            config/ \
            README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: adebayo-devops-build
          path: adebayo-devops-build.tar.gz
  
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    needs: build

    env: 
      APP_ENV: ${{vars.APP_ENV}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify staging environment
        run: |
          echo "Deploying to environment $APP_ENV"

          if [ -z "$DATABASE_PASSWORD" ]; then
            echo "Error: DATABASE_PASSWORD is not available"
            exit 1
          fi

          echo "DATABASE_PASSWORD is available"

      - name: Run environment script
        run: ./scripts/show-environment.sh
      
      - name: Simulate deployment
        run: echo "Deploying Adebayo Devops build"

  
